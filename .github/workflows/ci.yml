name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          # go.mod declara a versão mínima; a CI testa a correção mais
          # recente da mesma linha.
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Check formatting with gofumpt
        run: |
          files="$(go run mvdan.cc/gofumpt@v0.12.0 -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      # #region ci-go-validation
      - name: Run tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Fuzz the MCP parser
        run: >-
          go test -run '^$' -fuzz FuzzParseMessage -fuzztime 20s
          ./internal/adapters/mcpproxy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
      # #endregion

  # #region ci-lab-image
  lab-image:
    name: Lab image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # O laboratório só é reproduzível se a imagem compilar; os testes
      # Go não exercitam o contexto de build do Dockerfile.
      - name: Build laboratory image
        run: docker build -f deploy/Dockerfile -t guarita-lab:ci .
  # #endregion

  # #region ci-attack-suite
  attacks:
    name: Attack suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      # Um job à parte: a falha de um ataque aparece pelo nome no
      # resumo da execução, separada de lint e formatação, e o relato
      # de cada ataque fica no log.
      - name: Run laboratory attacks
        run: go test -race -count=1 -v ./attacks/...
  # #endregion
