name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cada action é fixada pelo commit, e não pela tag: uma tag pode ser
# movida para outro commit por quem controla o repositório da action, e
# o hash, não. O comentário diz a versão, e o Dependabot atualiza os dois.
permissions:
  contents: read

jobs:
  checks:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # go.mod declara a versão mínima; a CI testa a correção mais
          # recente da mesma linha.
          go-version: "1.27.x"
          check-latest: true
          cache: true

      - name: Check formatting with gofumpt
        run: |
          files="$(go run mvdan.cc/gofumpt@v0.12.0 -l .)"
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi

      # #region ci-go-validation
      - name: Run tests
        run: go test -race ./...

      # Sem -race, que mudaria o tempo medido; o SLO é generoso para
      # uma máquina compartilhada da CI.
      - name: Check the latency SLO
        env:
          GUARITA_SLO: "1"
        run: go test -count=1 -run TestSLO -v ./cmd/guarita

      - name: Run go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Fuzz the MCP parser
        run: >-
          go test -run '^$' -fuzz FuzzParseMessage -fuzztime 20s
          ./internal/adapters/mcpproxy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      # #endregion

  # #region ci-lab-image
  lab-image:
    name: Lab image build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O laboratório só é reproduzível se a imagem compilar; os testes
      # Go não exercitam o contexto de build do Dockerfile.
      - name: Build laboratory image
        run: docker build -f deploy/Dockerfile -t guarita-lab:ci .
  # #endregion

  # #region ci-attack-suite
  attacks:
    name: Attack suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      # Um job à parte: a falha de um ataque aparece pelo nome no
      # resumo da execução, separada de lint e formatação, e o relato
      # de cada ataque fica no log.
      - name: Run laboratory attacks
        run: go test -race -count=1 -v ./attacks/...
  # #endregion

  # #region ci-policy-tests
  policies:
    name: Policy tests
    runs-on: ubuntu-latest
    env:
      OPA: github.com/open-policy-agent/opa@v1.21.1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      # A mesma versão do OPA que a Guarita embute, pelo go run: o
      # binário que testa é o que decide em produção.
      - name: Check formatting and types
        run: |
          go run "$OPA" fmt --list --fail policies
          go run "$OPA" check --strict policies

      - name: Run opa test
        run: go run "$OPA" test -v policies
  # #endregion

  vulncheck:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      # #region ci-vulncheck
      # Falha se o código alcança uma vulnerabilidade conhecida, da
      # biblioteca padrão ou de um módulo; as que ele não chama ficam no
      # relatório, sem falhar.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # #endregion

  release:
    name: Reproducible release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          check-latest: true
          cache: true

      # #region ci-release
      - name: Install release tools
        env:
          CGO_ENABLED: "0"
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install \
            github.com/goreleaser/goreleaser/v2@v2.18.3
          GOBIN="$RUNNER_TEMP/tools" go install \
            github.com/anchore/syft/cmd/syft@v1.54.1

      # Os módulos ficam no cache antes: a release roda sem rede.
      - name: Download modules
        run: go mod download

      - name: Check GoReleaser configuration
        run: '"$RUNNER_TEMP/tools/goreleaser" check'

      # O mesmo commit em dois caminhos: binários e pacotes iguais, ou a
      # CI falha.
      - name: Build the release twice and compare
        run: TOOLS="$RUNNER_TEMP/tools" sh deploy/release/reproduce.sh
      # #endregion
